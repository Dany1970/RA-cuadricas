<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Antena parabólica metálica y OVNI</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  </head>
  <body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Antena parabólica en wireframe metálico -->
      <a-entity id="antena" position="0 0 -5"></a-entity>

      <!-- OVNI -->
      <a-entity geometry="primitive: sphere; radius: 1.5"
                material="color: purple; opacity: 0.8"
                position="0 10 -5"
                animation="property: position; to: 0 3 -5; dur: 5000; easing: linear"></a-entity>

      <!-- Punto sobre la parábola de corte -->
      <a-sphere radius="0.2" color="yellow" position="2 0.2 -5"></a-sphere>

      <!-- Rayo emitido desde el OVNI -->
      <a-entity line="start: 0 10 -5; end: 0 3 -5; color: red"
                visible="false"
                animation__show="property: visible; to: true; delay: 3000; dur: 1"></a-entity>

      <!-- Rayo reflejado hacia el foco -->
      <a-entity line="start: 0 3 -5; end: 0 0 -5; color: orange"
                visible="false"
                animation__show="property: visible; to: true; delay: 3500; dur: 1"></a-entity>

      <!-- Cámara -->
      <a-entity camera look-controls></a-entity>
    </a-scene>

    <script>
      // Crear paraboloide wireframe con textura metálica
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('loaded', () => {
        const antenaEl = document.querySelector('#antena');
        const geometry = new THREE.ParametricGeometry((u, v, target) => {
          const x = 5 * (u - 0.5);
          const y = 5 * (v - 0.5);
          const z = (x*x + y*y) / 20;
          target.set(x, y, z);
        }, 50, 50);

        const material = new THREE.MeshStandardMaterial({
          color: 0xaaaaaa,
          metalness: 0.9,
          roughness: 0.3,
          wireframe: true
        });

        const mesh = new THREE.Mesh(geometry, material);
        antenaEl.setObject3D('mesh', mesh);

        // Añadir luz para resaltar el efecto metálico
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        sceneEl.object3D.add(light);
      });
    </script>
  </body>
</html>
