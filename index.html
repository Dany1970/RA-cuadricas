<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Antena parabólica simplificada</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Luz ambiental para que se vea en móviles -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 0.8"></a-entity>
      <a-entity light="type: point; color: #ffffff; intensity: 1" position="5 5 5"></a-entity>

      <!-- Antena parabólica (cono invertido en wireframe) -->
      <a-entity geometry="primitive: cone; radiusTop: 0.1; radiusBottom: 5; height: 3"
                material="color: gray; wireframe: true"
                rotation="0 0 180"
                position="0 0 -5"></a-entity>

      <!-- OVNI -->
      <a-entity geometry="primitive: sphere; radius: 1.5"
                material="color: purple; opacity: 0.8"
                position="0 10 -5"
                animation="property: position; to: 0 3 -5; dur: 5000; easing: linear"></a-entity>

      <!-- Punto sobre la parábola de corte -->
      <a-sphere radius="0.2" color="yellow" position="2 0.2 -5"></a-sphere>

      <!-- Rayo emitido desde el OVNI -->
      <a-entity line="start: 0 10 -5; end: 0 3 -5; color: red"
                visible="false"
                animation__show="property: visible; to: true; delay: 3000; dur: 1"></a-entity>

      <!-- Rayo reflejado hacia el foco -->
      <a-entity line="start: 0 3 -5; end: 0 0 -5; color: orange"
                visible="false"
                animation__show="property: visible; to: true; delay: 3500; dur: 1"></a-entity>

      <!-- Cámara -->
      <a-entity camera look-controls></a-entity>
    </a-scene>
  </body>
</html>
